# Public measurement settings; acceptance policy is separate.
model_name: "Qwen/Qwen3.8-Flash-Next-FP8"
datasets: [gsm8k, aime25]
eval_batch_size: 32
startup_max_wait_seconds: 1800
generation_config:
  seed: 1236
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 1.5
  max_tokens: 32768
  stream: true
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
server_args: "--tensor-parallel-size 4"
