schema_version = "1.2"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "inference-bench/support_qwen38_flash_next_4xb200_vllm"
description = "Native Qwen3.8-Flash-Next-FP8 support on 4xB200: correct and efficient QSA, bounded-memory PLE, ordinary fresh-request/prefix reuse, and stateful MTP3 serving, with model quality and engine regressions preserved."
authors = [{ name = "Inference-Bench maintainers" }]
keywords = ["day0", "model_support", "vllm", "b200", "moe", "sparse-attention", "linear-attention", "fp8", "prefix-caching", "hybrid-cache", "long-context"]

[agent]
timeout_sec = 30000

[environment]
build_timeout_sec = 12400
cpus = 64
memory_mb = 524288
storage_mb = 1048576
shm_size_mb = 65536
gpus = 4
gpu_types = ["B200"]
workdir = "/app"
allow_internet = false

[environment.env]
INFB_AGENT_TIMEOUT_SEC = "30000"
PATH = "/opt/vllm/bin:/root/.cargo/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[environment.healthcheck]
command = "bash /app/scripts/start_agent_timer.sh || true"

[verifier]
timeout_sec = 48900
environment_mode = "separate"

[verifier.env]
INFB_OFFICIAL = "1"
INFB_REAL_ENGINE = "1"
PATH = "/opt/vllm/bin:/root/.cargo/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[verifier.environment]
build_timeout_sec = 3600
cpus = 64
memory_mb = 524288
storage_mb = 1048576
shm_size_mb = 65536
gpus = 4
gpu_types = ["B200"]
allow_internet = false

[metadata]
category = "model_support"
repository_url = "https://github.com/vllm-project/vllm"
base_commit_hash = "a5e63c9ee859ceb2f299ff55f063c7c32f94f08b"
reference_commit_hash = "e126687a9a828d513c01a07cd69f025f27d63280"
model_repository = "Qwen/Qwen3.8-Flash-Next-FP8"
model_revision = "236dfdf285828023ca3bcd3f37366c58a3469b13"

[metadata.inference_bench]
candidate_capture = "pre_artifacts"
tier = "regular"
category = "model_support"
engine = "vllm"
score_profile = "model_support_qwen38_expanded_v7"

[metadata.inference_bench.edit_policy]
csrc = true
