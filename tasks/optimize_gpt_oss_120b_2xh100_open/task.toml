schema_version = "1.2"

[task]
name = "inference-bench/optimize_gpt_oss_120b_2xh100_open"
description = "Optimize vLLM throughput for OpenAI gpt-oss-120b on 2×H100 / vLLM 0.19.1. Sparse MoE with 117B total / 5.1B active parameters, MXFP4-quantized expert weights (vLLM native _load_weights_mxfp4 path), GQA attention. Reference open-source MoE coverage in the throughput-opt suite."
authors = [{ name = "Inference-Bench maintainers" }]
keywords = ["vllm", "throughput-optimization", "gpt-oss", "moe", "mxfp4", "h100", "tp2"]

[agent]
timeout_sec = 30000

[verifier]
timeout_sec = 18000

[environment]
build_timeout_sec = 7200
cpus = 32
memory_mb = 262144
storage_mb = 163840
# /dev/shm for the engine's shared-memory IPC: the /dev/shm/vllm_* segments the engine
# creates per worker, plus the torch/NCCL shared-memory transports. Docker's default is
# 64 MiB, which the verifier preflight voids as `dev_shm_too_small` (floor 1 GiB).
shm_size_mb = 16384
gpus = 2
# H100-only: the baseline was produced on H100 (sm_90). Running on B200 (sm_100) would
# invalidate that baseline, because MXFP4 / fused-MoE kernel selection differs.
gpu_types = ["H100"]
allow_internet = false
workdir = "/app"

[metadata.inference_bench]
tier = "regular"
category = "throughput_optimization"
engine = "vllm"
score_profile = "throughput_optimization_v1"

[metadata.inference_bench.official]
requires_real_engine = true

[metadata.inference_bench.target]
repo = "https://github.com/vllm-project/vllm.git"
commit = "v0.19.1"
workdir = "/app/repo"

[metadata.inference_bench.target_environment]
python = "3.12"
cuda = "12.8"
engine_install = "task_scoped_vllm_0_19_1_with_source_overlay"

[metadata.inference_bench.model]
hf_model_id = "openai/gpt-oss-120b"
architecture = "GptOssForCausalLM"
total_parameters = "117B"
activated_parameters = "5.1B"
context_window = 4096
dtype = "auto"
tensor_parallel_size = 2

[metadata.inference_bench.scoring]
primary_metric = "tokens_per_second"
num_runs = 5
warmup_runs = 1

[metadata.inference_bench.correctness]
mode = "loose"
comparison = "tokens"
atol = 0.05
rtol = 0.05
min_pass_rate = 0.95
num_prompts = 20
max_tokens = 100

[[metadata.inference_bench.workloads]]
name = "decode_heavy"
input_len = 1024
output_len = 8192
num_prompts = 4
max_concurrency = 1

[[metadata.inference_bench.workloads]]
name = "prefill_heavy"
input_len = 8192
output_len = 1
num_prompts = 256
max_concurrency = 1

[[metadata.inference_bench.workloads]]
name = "high_load"
input_len = 1024
output_len = 1024
num_prompts = 256

[metadata.inference_bench.commands]

[environment.healthcheck]
command = "bash /app/scripts/pier_healthcheck.sh"
# Generous on purpose. Preparation copies overlays and relinks a venv -- minutes, not seconds -- and a timeout here is
# NOT retried: the docker backend raises RuntimeError("Command timed out after N seconds"), which would kill the trial
# with a message that says nothing about preparation.
timeout_sec = 3600.0
# One attempt: preparation is deterministic, so a second run fails the same way, and a red healthcheck is the signal.
retries = 1

[environment.env]

INFB_EDIT_POLICY_CSRC = "1"
INFB_EDIT_POLICY_PKGS = "triton_kernels"
INFB_EDIT_POLICY_CSRC_DEPS = "1"
# Fallback budget for a backend where no launcher injects one; MUST equal [agent]
# timeout_sec above.
INFB_AGENT_TIMEOUT_SEC = "30000"
INFB_VLLM_PYTHON = "/opt/venv/bin/python3"
INFB_WORKLOAD_NUM_RUNS_DECODE_HEAVY = "1"
INFB_WORKLOAD_NUM_RUNS_HIGH_LOAD = "2"
INFB_WORKLOAD_NUM_RUNS_PREFILL_HEAVY = "5"
MAX_JOBS = "8"
VLLM_USE_AOT_COMPILE = "0"

[verifier.env]
INFB_EDIT_POLICY_CSRC = "1"
INFB_EDIT_POLICY_CSRC_DEPS = "1"
INFB_EDIT_POLICY_PKGS = "triton_kernels"
INFB_CORRECTNESS_MODE = "loose"
INFB_OFFICIAL = "1"
INFB_VLLM_PYTHON = "/opt/venv/bin/python3"
INFB_WORKLOAD_BOOTS_DECODE_HEAVY = "2"
INFB_WORKLOAD_NUM_RUNS_DECODE_HEAVY = "1"
INFB_WORKLOAD_NUM_RUNS_HIGH_LOAD = "2"
INFB_WORKLOAD_NUM_RUNS_PREFILL_HEAVY = "5"
MAX_JOBS = "8"
VLLM_USE_AOT_COMPILE = "0"
