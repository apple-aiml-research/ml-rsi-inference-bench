schema_version = "1.2"

[task]
name = "inference-bench/regression_sglang_stream_decode_tps_c1"
description = "Recover a large streaming-decode throughput regression on gpt-oss-120b at concurrency 1. At the pinned commit the overlap scheduler's per-iteration work contains a device-to-host synchronization that cannot overlap the forward pass, and it costs roughly 1 ms per generated token. TWO independent repairs are known and both are legitimate: remove the synchronization (the min_new_tokens penalizer's boolean-mask indexing, measured at 1.39-1.41x) or restore the overlap the barrier introduced in PR #26380 removed (measured at 1.31-1.42x). The task scores recovered generated-token throughput and does not care which route a candidate takes."
authors = [{ name = "Inference-Bench maintainers" }]
keywords = ["sglang", "regression", "streaming", "decode", "runtime", "lite"]

[agent]
timeout_sec = 30000

[verifier]
env = { INFB_OFFICIAL = "1", INFB_REAL_ENGINE = "1" }
timeout_sec = 10800

[environment]
build_timeout_sec = 7200
cpus = 96
memory_mb = 786432
storage_mb = 409600
shm_size_mb = 32768
gpus = 4
gpu_types = ["B200"]
allow_internet = false
workdir = "/app"

[environment.healthcheck]
command = "bash /app/scripts/pier_healthcheck.sh"
timeout_sec = 3600.0
retries = 1

[metadata.inference_bench]
tier = "lite"
category = "regression"
engine = "sglang"
score_profile = "regression_recovery_v2"

[metadata.inference_bench.official]
requires_real_engine = true

[metadata.inference_bench.target]
repo = "https://github.com/sgl-project/sglang.git"
workdir = "/app/repo"
baseline_commit = "163b97012707d712e141e7ee486b72e2b0d8e60d"
baseline_relation = "The merge commit of upstream PR #26380 -- the FIRST upstream state carrying the regression, not the last state before its fix. That choice is the reason this task exists at this pin rather than at the fix's parent. Upstream's report compares 163b970^ against 163b970 and measures -34.6 % on this exact model and shape; the parent of the eventual fix (441ae9a5, PR #28363) sits 1154 commits later, by which time unrelated follow-up work had already reclaimed most of it, measured on 4xB200 at 1.031x -- below any usable gate. The staged tree is the FLATTENED python/ subtree, so repo/sglang is the package root, and the image bakes it as a gzipped ARCHIVE rather than an extracted tree so the scored baseline is not writable by the agent. tests/pristine_tree.sha256 is the digest the verifier checks the staged pristine arm against, and it fails closed."

[metadata.inference_bench.model]
hf_model_family = "openai/gpt-oss-120b"
hf_model_id = "openai/gpt-oss-120b"
gated = false
architecture = "GptOssForCausalLM"
model_type = "gpt_oss"
feature = "The model upstream's own top row uses. It is also a hybrid-SWA architecture, so it exercises the sliding-window half of the shared mapping the barrier protects."

[metadata.inference_bench.target_environment]
python = "3.12"
engine_install = "dependency_closure_in_the_venv__engine_python_unpacked_from_a_baked_archive_of_the_pinned_tree"
builds_engine_in_image = true

[metadata.inference_bench.oracle]
oracle_id = "min_new_tokens_no_host_sync"
source = "the_repair_named_but_unmerged_in_upstream_pr_28363"
oracle_scope = "THERE ARE AT LEAST THREE LEGITIMATE ROUTES AND THE ORACLE IS ONE OF THEM. (a) PR #28363's BODY says 'Also makes the min_new_tokens penalizer non-synchronizing (torch.where instead of boolean-mask indexing)', and that hunk is ABSENT from its 9 merged files; upstream main carries it today as `logits.add_(torch.where(mask, self.stop_token_penalties, 0.0))`, which is exactly what this oracle does (with masked_fill_, one elementwise op instead of a [B, V] temp). (b) The per-step host-to-device copy in schedule_batch is real and upstream says so in its own comment -- but upstream's repair is to make it ASYNC (pin_memory + non_blocking), not to skip it. That is STRICTLY MORE GENERAL than this oracle's route, which only helps when every active penalizer is length-based; a candidate that takes the async route is correct and must score. (c) The coarse barrier itself, which is what #28363 actually merged and which does NOT port to this pin -- see below. A gate keyed on any one of these spellings would be wrong for the other two, which is why REQUIRED_TERMS is metrics-only and check_candidate names no file. THE DEFECT: BatchedMinNewTokensPenalizer._apply indexes logits with a boolean mask, which must copy the selected-element count back to the host before it can allocate -- a device-to-host synchronization on every decode step, sitting in the per-iteration path that the coarse barrier prevents from overlapping the forward. THE ORACLE rewrites that indexing as an in-place masked fill, and adds the penalizer flag that lets schedule_batch skip the per-step copy when no active penalizer needs the output ids; solution/min_new_tokens_no_host_sync.patch is the whole change. It is output-preserving by construction: bitwise-identical logits in float32 and in bfloat16 on the real shapes, and torch.cuda.set_sync_debug_mode('error') raises on the boolean-mask form and does not raise on this one. WHAT THE SCORED RATIO COMPARES: generated-token throughput of the candidate tree against the unmodified pristine tree, both benched in the same run on the same GPUs, geometric mean over the scored shapes. A tree that changes nothing reproduces the pristine tree's tokens exactly and reads at the noise floor, so the ratio measures the repair rather than the rig. WHY ROUTE (c) IS NOT THE ORACLE: porting the merged barrier back to this pin only reorders streams and events, yet at this pin it changes the decoded tokens against the pristine tree and is not stable across its own rounds -- the read-done event is published where it does not guarantee the forward has finished reading the shared pools in THIS tree. Upstream wrote #28363 1154 commits later, against a tree whose decode CUDA-graph runner had been split out and whose barrier had a gate; whether the idea ports to this pin is OPEN and is not this task's oracle. Upstream's own #28363 description names the penalizer repair too, though the hunk is absent from their merged diff, and by the fix's parent 1154 commits later the penalizer is already torch.where, which is exactly why that pair measures only 1.031x."

[metadata.inference_bench.scoring]
kind = "regression_recovery"
metric = "throughput"
measured_key = "throughput.output_tokens_per_sec"
higher_is_better = true
noise_floor = 1.03
oracle_speedup = 1.398
oracle_speedup_per_workload = { in1000_out1000_n5_c1_stream = 1.428, in1000_out1000_n8_c4_stream = 1.389, in1000_out2000_n3_c1_stream = 1.379 }
oracle_measured_on = "4xB200, the workload matrix: geometric mean over the three scored points of streamed output tokens/s, warmed rotated rounds, against the unmodified pristine tree benched in the same run. The declared oracle_speedup is that geomean and oracle_speedup_per_workload carries the per-shape values."

[metadata.inference_bench.real_engine_thresholds.latency]
max_e2e_mean_ms = 120000.0

[metadata.inference_bench.real_engine_thresholds.throughput]
min_request_per_sec = 0.1
min_total_tokens_per_sec = 1.0


[metadata.inference_bench.real_engine_thresholds.serve]
min_request_per_sec = 0.1
min_total_tokens_per_sec = 1.0
max_ttft_mean_ms = 5000.0

[metadata.inference_bench.workloads]
in1000_out1000_n5_c1_stream = { input_len = 1000, output_len = 1000, num_prompts = 5, concurrency = 1, streaming = true }
in1000_out2000_n3_c1_stream = { input_len = 1000, output_len = 2000, num_prompts = 3, concurrency = 1, streaming = true }
in1000_out1000_n8_c4_stream = { input_len = 1000, output_len = 1000, num_prompts = 8, concurrency = 4, streaming = true }
in1000_out1000_n32_c16_stream = { input_len = 1000, output_len = 1000, num_prompts = 32, concurrency = 16, streaming = true, role = "guard", min_ratio = 0.95 }
ttft_c1 = { input_len = 1000, output_len = 1000, num_prompts = 5, concurrency = 1, role = "guard", min_ratio = 0.90, from = "in1000_out1000_n5_c1_stream", metric_key = "latency_ms.ttft.mean", lower_is_better = true }

[metadata.inference_bench.runtime]
model = "openai/gpt-oss-120b"
engine_kwargs = "tp_size=4"
scored_client = "aiperf==0.12.0 profile --endpoint-type completions --streaming --concurrency 1"

[metadata.inference_bench.artifacts]

[environment.env]
INFB_AGENT_TIMEOUT_SEC = "30000"
